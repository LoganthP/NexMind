<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="NexMind — turn repositories and documents into a living 3D knowledge graph">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a18"/>
      <stop offset="0.55" stop-color="#0c1230"/>
      <stop offset="1" stop-color="#160b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <ellipse cx="600" cy="170" rx="420" ry="170" fill="url(#spot)">
    <animate attributeName="ry" values="160;185;160" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- orbit -->
  <ellipse cx="600" cy="170" rx="330" ry="105" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3 12">
    <animate attributeName="stroke-dashoffset" values="0;-300" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- edges (base) -->
  <g stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.4">
    <line x1="80" y1="90" x2="190" y2="60"/>
    <line x1="80" y1="90" x2="150" y2="170"/>
    <line x1="190" y1="60" x2="270" y2="130"/>
    <line x1="150" y1="170" x2="270" y2="130"/>
    <line x1="150" y1="170" x2="90" y2="260"/>
    <line x1="150" y1="170" x2="220" y2="270"/>
    <line x1="270" y1="130" x2="320" y2="220"/>
    <line x1="220" y1="270" x2="320" y2="220"/>
    <line x1="90" y1="260" x2="220" y2="270"/>
    <line x1="900" y1="110" x2="1010" y2="70"/>
    <line x1="1010" y1="70" x2="1120" y2="120"/>
    <line x1="900" y1="110" x2="960" y2="200"/>
    <line x1="1010" y1="70" x2="960" y2="200"/>
    <line x1="960" y1="200" x2="1080" y2="230"/>
    <line x1="1120" y1="120" x2="1080" y2="230"/>
    <line x1="960" y1="200" x2="900" y2="290"/>
    <line x1="1080" y1="230" x2="1130" y2="300"/>
    <line x1="900" y1="290" x2="1080" y2="230"/>
  </g>

  <!-- edges (signal pulses) -->
  <g stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" fill="none" stroke-dasharray="10 260">
    <line x1="80" y1="90" x2="150" y2="170"><animate attributeName="stroke-dashoffset" values="270;0" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="150" y1="170" x2="270" y2="130"><animate attributeName="stroke-dashoffset" values="270;0" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></line>
    <line x1="270" y1="130" x2="320" y2="220"><animate attributeName="stroke-dashoffset" values="270;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></line>
    <line x1="90" y1="260" x2="220" y2="270"><animate attributeName="stroke-dashoffset" values="270;0" dur="3s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="900" y1="110" x2="960" y2="200"><animate attributeName="stroke-dashoffset" values="270;0" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></line>
    <line x1="960" y1="200" x2="1080" y2="230"><animate attributeName="stroke-dashoffset" values="270;0" dur="2.1s" begin="1s" repeatCount="indefinite"/></line>
    <line x1="1010" y1="70" x2="1120" y2="120"><animate attributeName="stroke-dashoffset" values="270;0" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></line>
    <line x1="1080" y1="230" x2="1130" y2="300"><animate attributeName="stroke-dashoffset" values="270;0" dur="2.3s" begin="1.4s" repeatCount="indefinite"/></line>
  </g>

  <!-- nodes -->
  <g>
    <g fill="#22d3ee">
      <circle cx="80" cy="90" r="5"/><circle cx="270" cy="130" r="6"/><circle cx="220" cy="270" r="5"/>
      <circle cx="960" cy="200" r="6"/><circle cx="1120" cy="120" r="5"/>
    </g>
    <g fill="#818cf8">
      <circle cx="190" cy="60" r="4.5"/><circle cx="150" cy="170" r="7"/><circle cx="320" cy="220" r="4.5"/>
      <circle cx="900" cy="110" r="5"/><circle cx="1080" cy="230" r="7"/><circle cx="900" cy="290" r="4.5"/>
    </g>
    <g fill="#e879f9">
      <circle cx="90" cy="260" r="4.5"/><circle cx="1010" cy="70" r="5"/><circle cx="1130" cy="300" r="4.5"/>
    </g>
    <!-- halos -->
    <g fill="none" stroke-width="1.5">
      <circle cx="150" cy="170" r="7" stroke="#818cf8"><animate attributeName="r" values="7;20" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="130" r="6" stroke="#22d3ee"><animate attributeName="r" values="6;18" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="230" r="7" stroke="#818cf8"><animate attributeName="r" values="7;20" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="200" r="6" stroke="#22d3ee"><animate attributeName="r" values="6;18" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="70" r="5" stroke="#e879f9"><animate attributeName="r" values="5;16" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="185" font-size="104" font-weight="800" fill="url(#title)" filter="url(#soft)" opacity="0.55">NexMind</text>
    <text x="600" y="185" font-size="104" font-weight="800" fill="url(#title)">NexMind</text>
    <text x="600" y="235" font-size="22" fill="#cbd5e1" opacity="0">Turn repositories &amp; documents into a living 3D knowledge graph — then chat with it.
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="600" y="290" font-size="15" letter-spacing="3" fill="#94a3b8" opacity="0">RAG  ·  KNOWLEDGE GRAPH  ·  3D VISUALIZATION  ·  LOCAL-FIRST
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1s" fill="freeze"/>
    </text>
  </g>
</svg>
