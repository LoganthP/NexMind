<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="NexMind pipeline: sources, parse, graph, index, chat">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a3a"/><stop offset="1" stop-color="#0a1028"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="200" rx="18" fill="#070b1a"/>
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- connectors -->
    <g stroke="#334155" stroke-width="2">
      <line x1="180" y1="100" x2="210" y2="100"/><line x1="375" y1="100" x2="405" y2="100"/>
      <line x1="570" y1="100" x2="600" y2="100"/><line x1="765" y1="100" x2="795" y2="100"/>
    </g>
    <g fill="#22d3ee">
      <circle r="4"><animateMotion path="M180,100 H210" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle r="4"><animateMotion path="M375,100 H405" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle r="4"><animateMotion path="M570,100 H600" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle r="4"><animateMotion path="M765,100 H795" dur="1.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- cards -->
    <g stroke-width="2" fill="url(#card)">
      <rect x="15" y="40" width="165" height="120" rx="16" stroke="#22d3ee" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="210" y="40" width="165" height="120" rx="16" stroke="#38bdf8" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="1s" repeatCount="indefinite"/></rect>
      <rect x="405" y="40" width="165" height="120" rx="16" stroke="#818cf8" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="2s" repeatCount="indefinite"/></rect>
      <rect x="600" y="40" width="165" height="120" rx="16" stroke="#a78bfa" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="3s" repeatCount="indefinite"/></rect>
      <rect x="795" y="40" width="190" height="120" rx="16" stroke="#e879f9" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" begin="4s" repeatCount="indefinite"/></rect>
    </g>

    <g font-size="13" font-weight="700" letter-spacing="2">
      <text x="97" y="72" fill="#22d3ee">01</text><text x="292" y="72" fill="#38bdf8">02</text>
      <text x="487" y="72" fill="#818cf8">03</text><text x="682" y="72" fill="#a78bfa">04</text>
      <text x="890" y="72" fill="#e879f9">05</text>
    </g>
    <g font-size="20" font-weight="700" fill="#f1f5f9">
      <text x="97" y="104">Sources</text><text x="292" y="104">Parse</text>
      <text x="487" y="104">Graph</text><text x="682" y="104">Index</text>
      <text x="890" y="104">Chat &amp; Explore</text>
    </g>
    <g font-size="12.5" fill="#94a3b8">
      <text x="97" y="132">Repos · folders · files</text><text x="292" y="132">Code &amp; text chunks</text>
      <text x="487" y="132">Entities &amp; relations</text><text x="682" y="132">Search-ready context</text>
      <text x="890" y="132">Cited answers, lit nodes</text>
    </g>
  </g>
</svg>
