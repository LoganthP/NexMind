[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexmind"
version = "1.1.0"
description = "AI repository & document intelligence: live 3D knowledge graph + GraphRAG chat"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "python-dotenv>=1.0",
  "networkx>=3.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pypdf>=4.0", "python-docx>=1.1",
  "langchain-text-splitters>=0.2", "langchain-core>=0.2",
]

[project.optional-dependencies]
llm = ["langchain-anthropic>=0.3", "langchain-openai>=0.2", "langchain-ollama>=0.2"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0"]

[project.scripts]
nexmind = "nexmind.cli:main"

[tool.setuptools.packages.find]
include = ["nexmind*"]
